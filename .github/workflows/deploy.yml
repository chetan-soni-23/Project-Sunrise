name: Deploy

on:
  push:
    branches: [main]

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend can start
        working-directory: backend
        run: node -e "require('./src/routes/auth'); require('./src/routes/flights'); require('./src/routes/hotels'); require('./src/routes/bookings'); require('./src/routes/policies'); require('./src/routes/dashboard'); console.log('All routes loaded successfully')"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: ls -la frontend/dist/ && echo "Build successful!"
